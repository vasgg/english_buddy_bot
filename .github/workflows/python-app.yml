# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:



permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_buddy_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d english_buddy_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: test-token
      ADMIN: "1"
      SUB_ADMINS: "[]"
      TEACHERS: "[]"
      TOP_BAD_SLIDES_COUNT: "10"
      STAGE: dev
      REDIS_URL: redis://localhost:6379/1
      TASKIQ_REDIS_URL: redis://localhost:6379/2
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/english_buddy_bot_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/english_buddy_bot_test

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Sync dependencies
      run: |
        uv sync --frozen --all-groups
    - name: Lint (ruff)
      run: |
        uv run ruff check .
    - name: Format (ruff)
      run: |
        uv run ruff format --check .
    - name: Typecheck (ty)
      run: |
        uv run ty check src --output-format concise --exit-zero
    - name: Test (pytest)
      run: |
        uv run pytest
